<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตารางน้ำขึ้นน้ำลง เกาะสมุย</title>
<style>
:root{
  --bg:#070c12; --bg2:#0d141d; --card:#111a24; --card2:#16212d;
  --line:#22303f; --line2:#2d3e50;
  --txt:#e8f0f7; --dim:#8ba0b4; --dim2:#5d7488;
  --water:#38bdf8; --water2:#0ea5e9;
  --high:#fbbf24; --low:#f472b6; --flow:#34d399;
  --hot:#f87171;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%, #12283d 0%, transparent 62%),
    radial-gradient(900px 500px at 92% 4%, #10233a 0%, transparent 58%),
    var(--bg);
  color:var(--txt);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,"Sukhumvit Set","Thonburi",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
  padding:0 0 80px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ── header ───────────────────────────── */
header{padding:38px 0 26px}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--water);
  font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--flow);
  box-shadow:0 0 0 4px rgba(52,211,153,.16);animation:pulse 2.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(52,211,153,0)}}
h1{font-size:clamp(28px,4.6vw,42px);font-weight:700;letter-spacing:-.5px;margin:8px 0 6px}
h1 span{color:var(--water)}
.sub{color:var(--dim);font-size:14.5px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.btn{background:var(--card);border:1px solid var(--line);color:var(--dim);
  padding:8px 15px;border-radius:999px;font-size:13.5px;cursor:pointer;
  font-family:inherit;transition:.16s;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--line2);color:var(--txt);background:var(--card2)}
.btn.on{background:rgba(56,189,248,.14);border-color:rgba(56,189,248,.5);color:#bae6fd}

/* ── today hero ───────────────────────── */
.hero{background:linear-gradient(165deg,var(--card) 0%,#0c141c 100%);
  border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.85)}
.hero-top{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;
  justify-content:space-between;padding:24px 26px 18px}
.hero-when{font-size:12.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--water)}
.hero-date{font-size:clamp(21px,3vw,27px);font-weight:700;margin-top:3px}
.hero-meta{color:var(--dim);font-size:13.5px;margin-top:5px;
  display:flex;flex-wrap:wrap;gap:6px 16px}
.hero-verdict{max-width:430px;color:var(--txt);font-size:14.5px;
  background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.18);
  border-left:3px solid var(--water);border-radius:0 12px 12px 0;padding:11px 15px}

/* score ring */
.ring{position:relative;width:104px;height:104px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring-val{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0}
.ring-num{font-size:29px;font-weight:700;line-height:1}
.ring-cap{font-size:10.5px;color:var(--dim);letter-spacing:.08em}

/* chart */
.chartbox{position:relative;padding:4px 10px 0}
svg.chart{display:block;width:100%;height:auto}
.chart text{font-family:inherit}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:9px;padding:14px 26px 24px}
.chip{display:flex;align-items:center;gap:9px;background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13.5px}
.chip b{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.chip .lbl{color:var(--dim);font-size:11.5px;letter-spacing:.04em}
.chip.hi{border-color:rgba(251,191,36,.34);background:rgba(251,191,36,.08)}
.chip.hi b{color:var(--high)}
.chip.lo{border-color:rgba(244,114,182,.34);background:rgba(244,114,182,.08)}
.chip.lo b{color:var(--low)}
.chip.fl{border-color:rgba(52,211,153,.34);background:rgba(52,211,153,.08)}
.chip.fl b{color:var(--flow)}
.chip i{font-style:normal;opacity:.55;font-size:15px}

/* ── section ──────────────────────────── */
h2{font-size:19px;font-weight:700;margin:44px 0 4px;display:flex;
  align-items:center;gap:11px}
h2::before{content:"";width:3px;height:19px;background:var(--water);border-radius:3px}
.note{color:var(--dim);font-size:13.5px;margin-bottom:18px}

/* next days strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:11px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.scard:hover{border-color:var(--line2);transform:translateY(-2px);background:var(--card2)}
.scard .sd{font-size:12.5px;color:var(--dim)}
.scard .sn{font-size:16px;font-weight:700;margin:1px 0 7px}
.scard .sv{font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between}
.scard .sv b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.scard .spark{margin:8px 0 6px}
.scard .bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:9px}
.scard .bar i{display:block;height:100%;border-radius:2px}

/* ── year calendar ────────────────────── */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:15px}
.month{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 15px 12px}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.mh b{font-size:15.5px;font-weight:700}
.mh span{font-size:11.5px;color:var(--dim2)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.dow div{text-align:center;font-size:10px;color:var(--dim2);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid transparent;
  background:var(--card2);cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:.12s;overflow:hidden}
.cell.pad{background:transparent;cursor:default;pointer-events:none}
.cell:hover{border-color:var(--water);transform:scale(1.13);z-index:5}
.cell .n{font-size:11px;font-weight:600;line-height:1;position:relative;z-index:2}
.cell .sp{position:absolute;left:0;right:0;bottom:0;height:46%;opacity:.5;z-index:1}
.cell.today{border-color:var(--water);box-shadow:0 0 0 2px rgba(56,189,248,.28)}
.cell.today .n{color:#bae6fd}
.cell.past{opacity:.42}
.cell.moonfull::after,.cell.moonnew::after{content:"";position:absolute;top:3px;right:3px;
  width:5px;height:5px;border-radius:50%;z-index:3}
.cell.moonfull::after{background:#fef3c7}
.cell.moonnew::after{background:#475569;box-shadow:inset 0 0 0 1px #94a3b8}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:16px 0 0;
  color:var(--dim);font-size:12.5px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;
  margin-right:6px;vertical-align:-1px}
.scale{display:flex;height:9px;width:132px;border-radius:5px;overflow:hidden}
.scale i{flex:1;margin:0;border-radius:0;width:auto;height:auto}

/* ── modal ────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(3,7,12,.82);backdrop-filter:blur(7px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;
  width:min(880px,100%);max-height:92vh;overflow:auto;
  box-shadow:0 40px 90px -20px #000}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;
  padding:20px 22px 12px;gap:16px;position:sticky;top:0;
  background:linear-gradient(180deg,var(--bg2) 72%,transparent);z-index:2}
.close{background:none;border:1px solid var(--line);color:var(--dim);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:17px;
  flex:0 0 auto;line-height:1}
.close:hover{color:var(--txt);border-color:var(--line2)}
.mnav{display:flex;gap:7px;padding:0 22px 18px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
td{font-variant-numeric:tabular-nums}
.tw{padding:0 22px 20px}

footer{margin-top:52px;padding-top:24px;border-top:1px solid var(--line);
  color:var(--dim2);font-size:12.5px;line-height:1.75}
footer b{color:var(--dim)}
footer code{background:var(--card);padding:1.5px 6px;border-radius:5px;
  font-size:11.5px;color:var(--water)}
.warn{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.22);
  border-radius:12px;padding:12px 15px;color:#fca5a5;font-size:13px;margin:18px 0}
@media(max-width:560px){
  .hero-top{padding:18px 17px 14px}.chips{padding:12px 17px 19px}
  .months{grid-template-columns:1fr}
}
</style>
</head>

<header>

<footer id="foot"></footer>
</div>

const D = DATA.days;
const byDate = Object.fromEntries(D.map((d,i)=>[d.d,i]));
const DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];

/* ── helpers ─────────────────────────── */
const clock = h => {
  h = ((h % 24) + 24) % 24;
  let m = Math.round(h*60), hh = Math.floor(m/60)%24;
  return String(hh).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
};
/* Bangkok wall clock. Date.now() is absolute epoch ms, so shifting it by the
   fixed +07 offset and reading UTC fields gives local time on ANY host TZ. */
const bkk = () => new Date(Date.now() + 7*3600000);
const todayISO = () => bkk().toISOString().slice(0,10);
const nowHour = () => { const n = bkk(); return n.getUTCHours() + n.getUTCMinutes()/60; };
/* score -> colour: slack blue → strong green → spring amber */
const scoreColor = s => {
  const t = Math.max(0,Math.min(100,s))/100;
  const stops = [[0,[56,120,180]],[.45,[45,170,190]],[.72,[52,211,153]],[1,[251,191,36]]];
  for(let i=0;i<stops.length-1;i++){
    const [p0,c0]=stops[i], [p1,c1]=stops[i+1];
    if(t<=p1){
      const k=(t-p0)/(p1-p0||1);
      return `rgb(${c0.map((c,j)=>Math.round(c+(c1[j]-c)*k)).join(',')})`;
    }
  }
  return 'rgb(251,191,36)';
};
const smooth = pts => {           // Catmull-Rom → cubic path
  if(pts.length<2) return '';
  let p = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(i-1,0)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(i+2,pts.length-1)];
    p += `C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} `
       + `${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} `
       + `${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return p;
};

/* ── main chart ──────────────────────── */
function chart(day, {w=980,h=250,labels=true,live=false}={}){
  const padL=44, padR=18, padT=30, padB=26;
  const iw=w-padL-padR, ih=h-padT-padB;
  const c=day.curve, n=c.length;
  let lo=Math.min(...c), hi=Math.max(...c);
  const span=Math.max(hi-lo,.2); lo-=span*.42; hi+=span*.42;
  const X=hr=>padL+(hr/24)*iw;
  const Y=v=>padT+ih-((v-lo)/(hi-lo))*ih;
  const pts=c.map((v,i)=>[X(i*24/(n-1)),Y(v)]);
  const line=smooth(pts);
  const uid='g'+Math.random().toString(36).slice(2,8);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
  <defs>
    <linearGradient id="${uid}f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="${uid}s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/><stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>`;

  // night
  s+=`<rect x="${padL}" y="${padT}" width="${X(day.sr)-padL}" height="${ih}" fill="#020509" opacity=".55"/>`;
  s+=`<rect x="${X(day.ss)}" y="${padT}" width="${w-padR-X(day.ss)}" height="${ih}" fill="#020509" opacity=".55"/>`;

  // flow windows
  day.win.slice(0,3).forEach((wd,i)=>{
    s+=`<rect x="${X(wd[0])}" y="${padT}" width="${Math.max(X(wd[1])-X(wd[0]),1)}" height="${ih}"
      fill="#34d399" opacity="${i===0?.16:.07}"/>`;
    if(i===0&&labels)
      s+=`<text x="${(X(wd[0])+X(wd[1]))/2}" y="${padT+13}" fill="#6ee7b7" font-size="11"
        text-anchor="middle">น้ำเดินแรง</text>`;
  });

  // grid + hour axis
  for(let hr=0;hr<=24;hr+=3){
    s+=`<line x1="${X(hr)}" y1="${padT}" x2="${X(hr)}" y2="${padT+ih}" stroke="#ffffff" opacity=".055"/>`;
    if(labels) s+=`<text x="${X(hr)}" y="${h-8}" fill="#5d7488" font-size="10.5" text-anchor="middle">${String(hr%24).padStart(2,'0')}</text>`;
  }
  // level axis
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const v=lo+span*.42+ (Math.max(...c)-Math.min(...c))*i/ticks;
    if(v>hi) break;
    s+=`<line x1="${padL}" y1="${Y(v)}" x2="${w-padR}" y2="${Y(v)}" stroke="#ffffff" opacity=".05"/>`;
    if(labels) s+=`<text x="${padL-9}" y="${Y(v)+3.5}" fill="#5d7488" font-size="10.5" text-anchor="end">${v.toFixed(1)}</text>`;
  }

  // curve
  s+=`<path d="${line} L${X(24)},${padT+ih} L${padL},${padT+ih} Z" fill="url(#${uid}f)"/>`;
  s+=`<path d="${line}" fill="none" stroke="url(#${uid}s)" stroke-width="2.6" stroke-linecap="round"/>`;

  // extrema
  const mark=(list,color,text,up)=>list.forEach(([hr,v])=>{
    s+=`<circle cx="${X(hr)}" cy="${Y(v)}" r="5" fill="${color}" stroke="#0d141d" stroke-width="2"/>`;
    if(!labels) return;
    const anchor = hr<2.2?'start':hr>21.8?'end':'middle';
    const dy = up?-13:22;
    s+=`<text x="${X(hr)}" y="${Y(v)+dy}" fill="${color}" font-size="11.5" font-weight="600"
      text-anchor="${anchor}">${text} ${clock(hr)}</text>`;
    s+=`<text x="${X(hr)}" y="${Y(v)+dy+(up?-13:13)}" fill="${color}" font-size="10.5"
      opacity=".72" text-anchor="${anchor}">${v.toFixed(2)} m</text>`;
  });
  mark(day.hi,'#fbbf24','น้ำเต็ม',true);
  mark(day.lo,'#f472b6','น้ำลงสุด',false);

  // live marker
  if(live){
    const nh=nowHour();
    const idx=Math.round(nh/24*(n-1));
    s+=`<line x1="${X(nh)}" y1="${padT-6}" x2="${X(nh)}" y2="${padT+ih}" stroke="#fff"
      opacity=".62" stroke-width="1.4" stroke-dasharray="4 4"/>`;
    s+=`<circle cx="${X(nh)}" cy="${Y(c[idx])}" r="6.5" fill="#fff"/>`;
    s+=`<circle cx="${X(nh)}" cy="${Y(c[idx])}" r="11" fill="#fff" opacity=".2"/>`;
    s+=`<text x="${X(nh)}" y="${padT-12}" fill="#fff" font-size="11" font-weight="700"
      text-anchor="${nh<3?'start':nh>21?'end':'middle'}">ตอนนี้ ${c[idx].toFixed(2)} m</text>`;
  }
  return s+`</svg>`;
}

function spark(day,w=48,h=22){
  const c=day.curve, n=c.length;
  let lo=Math.min(...c), hi=Math.max(...c); const sp=Math.max(hi-lo,.05);
  const pts=c.filter((_,i)=>i%6===0).map((v,i,a)=>[i/(a.length-1)*w,h-((v-lo)/sp)*h*.88-1]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;width:100%">
    <path d="${smooth(pts)} L${w},${h} L0,${h} Z" fill="${scoreColor(day.score)}" opacity=".2"/>
    <path d="${smooth(pts)}" fill="none" stroke="${scoreColor(day.score)}" stroke-width="1.6"/></svg>`;
}

/* ── verdict text ────────────────────── */
function verdict(day){
  const w=day.win[0];
  const spring = day.rangepct>.72 ? 'น้ำเป็น ช่วงน้ำกว้าง'
               : day.rangepct<.28 ? 'น้ำตาย ช่วงน้ำแคบ' : 'น้ำกลางๆ';
  if(!w) return `${spring} — วันนี้น้ำแทบไม่เดิน ตกยากหน่อย`;
  const dir = w[4]?'น้ำขึ้น':'น้ำลง';
  const q = day.score>=72?'น้ำเดินดีมาก':day.score>=52?'น้ำเดินพอใช้':'น้ำเดินอ่อน';
  const sunTouch = [day.sr,day.ss].some(e=>e>=w[0]-1&&e<=w[1]+1);
  return `${q} • ${spring} — ช่วงดีสุด <b>${clock(w[0])}–${clock(w[1])}</b> (${dir}, `
    + `แรงสุด ${clock(w[2])} ที่ ${w[3].toFixed(0)} ซม./ชม.)`
    + (sunTouch?' ตรงกับช่วงหัวรุ่ง/หัวค่ำพอดี — จังหวะดี':'');
}

function ring(score){
  const r=46, C=2*Math.PI*r, off=C*(1-score/100), col=scoreColor(score);
  return `<div class="ring"><svg width="104" height="104">
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="#22303f" stroke-width="8"/>
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="${col}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg><div class="ring-val"><span class="ring-num" style="color:${col}">${score}</span>
  <span class="ring-cap">คะแนนน้ำ</span></div></div>`;
}

/* Diurnal days often carry a token second crest — headline the dominant one. */
const mainHi = d => d.hi.length ? d.hi.reduce((a,b)=>b[1]>a[1]?b:a) : null;
const mainLo = d => d.lo.length ? d.lo.reduce((a,b)=>b[1]<a[1]?b:a) : null;
const moonIcon = m => m>.96?'🌕':m>.72?'🌔':m>.54?'🌔':m>.46?'🌗':m>.28?'🌒':m>.04?'🌒':'🌑';

/* ── hero ────────────────────────────── */
function renderHero(iso){
  const i=byDate[iso] ?? byDate[todayISO()] ?? 0;
  const day=D[i], isToday = day.d===todayISO();
  const chips = [
    ...day.hi.map(([h,v])=>`<div class="chip hi"><i>▲</i><div><div class="lbl">น้ำเต็ม</div><b>${clock(h)}</b> · ${v.toFixed(2)} m</div></div>`),
    ...day.lo.map(([h,v])=>`<div class="chip lo"><i>▼</i><div><div class="lbl">น้ำลงสุด</div><b>${clock(h)}</b> · ${v.toFixed(2)} m</div></div>`),
    ...day.win.slice(0,2).map((w,k)=>`<div class="chip fl"><i>${w[4]?'↗':'↘'}</i><div><div class="lbl">${k?'น้ำเดินดีรอง':'น้ำเดินดีสุด'} (${w[4]?'ขึ้น':'ลง'})</div><b>${clock(w[0])}–${clock(w[1])}</b> · ${w[3].toFixed(0)} ซม./ชม.</div></div>`),
    `<div class="chip"><i>☀</i><div><div class="lbl">พระอาทิตย์</div><b>${clock(day.sr)}–${clock(day.ss)}</b></div></div>`,
    `<div class="chip"><i>${moonIcon(day.moon)}</i><div><div class="lbl">${day.moonlab}</div><b>สว่าง ${(day.moon*100).toFixed(0)}%</b></div></div>`,
    `<div class="chip"><i>↕</i><div><div class="lbl">ช่วงน้ำวันนี้</div><b>${day.range.toFixed(2)} m</b></div></div>`,
  ].join('');

  document.getElementById('hero').innerHTML = `
    <div class="hero-top">
      <div>
        <div class="hero-when">${isToday?'วันนี้':'วันที่เลือก'}</div>
        <div class="hero-date">${day.thai}</div>
        <div class="hero-meta"><span>${DATA.spot.label}</span><span>${day.d}</span></div>
      </div>
      <div class="hero-verdict">${verdict(day)}</div>
      ${ring(day.score)}
    </div>
    <div class="chartbox">${chart(day,{live:isToday})}</div>
    <div class="chips">${chips}</div>`;
}

/* ── strip ───────────────────────────── */
function renderStrip(){
  const start=byDate[todayISO()] ?? 0;
  document.getElementById('strip').innerHTML = D.slice(start,start+7).map(d=>`
    <div class="scard" data-d="${d.d}">
      <div class="sd">${d.thai.split(' ').slice(0,1)}</div>
      <div class="sn">${d.thai.split(' ').slice(1,3).join(' ')}</div>
      <div class="spark">${spark(d)}</div>
      <div class="sv"><span>น้ำเต็ม</span><b>${mainHi(d)?clock(mainHi(d)[0]):'—'}</b></div>
      <div class="sv"><span>น้ำลงสุด</span><b>${mainLo(d)?clock(mainLo(d)[0]):'—'}</b></div>
      <div class="bar"><i style="width:${d.score}%;background:${scoreColor(d.score)}"></i></div>
    </div>`).join('');
}

/* ── year grid ───────────────────────── */
function renderYear(){
  const tISO=todayISO();
  let html='';
  for(let m=0;m<12;m++){
    const days=D.filter(d=>+d.d.slice(5,7)===m+1);
    if(!days.length) continue;
    const pad=new Date(Date.UTC(DATA.year,m,1)).getUTCDay();
    const best=days.reduce((a,b)=>b.score>a.score?b:a);
    html+=`<div class="month"><div class="mh"><b>${DATA.months_full[m]}</b>
      <span>น้ำดีสุด ${best.d.slice(8)} ${DATA.months_abbr[m]}</span></div>
      <div class="dow">${DOW.map(x=>`<div>${x}</div>`).join('')}</div><div class="grid">`;
    html+='<div class="cell pad"></div>'.repeat(pad);
    for(const d of days){
      const cls=['cell'];
      if(d.d===tISO) cls.push('today'); else if(d.d<tISO) cls.push('past');
      if(d.moon>.97) cls.push('moonfull'); else if(d.moon<.03) cls.push('moonnew');
      html+=`<div class="${cls.join(' ')}" data-d="${d.d}"
        title="${d.thai} · คะแนน ${d.score}${mainHi(d)?' · น้ำเต็ม '+clock(mainHi(d)[0]):''}${mainLo(d)?' · น้ำลงสุด '+clock(mainLo(d)[0]):''}">
        <span class="n">${+d.d.slice(8)}</span>
        <span class="sp">${spark(d,40,14)}</span></div>`;
    }
    html+='</div></div>';
  }
  document.getElementById('months').innerHTML=html;
  document.getElementById('scaleBar').innerHTML =
    Array.from({length:22},(_,i)=>`<i style="background:${scoreColor(i/21*100)}"></i>`).join('');
}

/* ── modal ───────────────────────────── */
function openDay(iso){
  const i=byDate[iso]; if(i===undefined) return;
  const d=D[i];
  const events=[...d.hi.map(([h,v])=>({h,v,k:'น้ำเต็ม',c:'#fbbf24'})),
                ...d.lo.map(([h,v])=>({h,v,k:'น้ำลงสุด',c:'#f472b6'}))]
                .sort((a,b)=>a.h-b.h);
  document.getElementById('modal').innerHTML=`
    <div class="mtop">
      <div><div class="hero-when">${d.d===todayISO()?'วันนี้':'ตารางน้ำ'}</div>
        <div class="hero-date">${d.thai}</div>
        <div class="hero-meta"><span>${DATA.spot.label}</span><span>${d.moonlab} · สว่าง ${(d.moon*100).toFixed(0)}%</span></div>
      </div>
      ${ring(d.score)}
      <button class="close" id="mclose">✕</button>
    </div>
    <div class="chartbox">${chart(d,{live:d.d===todayISO()})}</div>
    <div class="tw" style="padding-top:8px"><div class="hero-verdict" style="max-width:none">${verdict(d)}</div></div>
    <div class="tw"><table><thead><tr><th>เวลา</th><th>เหตุการณ์</th><th>ระดับ</th></tr></thead><tbody>
      ${events.map(e=>`<tr><td><b>${clock(e.h)}</b></td>
        <td style="color:${e.c}">${e.k}</td><td>${e.v.toFixed(2)} m</td></tr>`).join('')}
    </tbody></table></div>
    <div class="tw"><table><thead><tr><th>ช่วงน้ำเดิน</th><th>ทิศ</th><th>แรงสุด</th><th>อัตรา</th></tr></thead><tbody>
      ${d.win.length?d.win.map(w=>`<tr><td><b>${clock(w[0])}–${clock(w[1])}</b></td>
        <td style="color:${w[4]?'#6ee7b7':'#fca5a5'}">${w[4]?'น้ำขึ้น ↗':'น้ำลง ↘'}</td>
        <td>${clock(w[2])}</td><td>${w[3].toFixed(0)} ซม./ชม.</td></tr>`).join('')
        :'<tr><td colspan="4" style="color:var(--dim)">ไม่มีช่วงน้ำเดินเด่น</td></tr>'}
    </tbody></table></div>
    <div class="mnav">
      ${i>0?`<button class="btn" data-go="${D[i-1].d}">← ${D[i-1].d.slice(5)}</button>`:''}
      <button class="btn" data-hero="${d.d}">แสดงด้านบน</button>
      ${i<D.length-1?`<button class="btn" data-go="${D[i+1].d}">${D[i+1].d.slice(5)} →</button>`:''}
    </div>`;
  document.getElementById('ov').classList.add('open');
  document.getElementById('mclose').onclick=closeDay;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openDay(b.dataset.go));
  document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{
    renderHero(b.dataset.hero); closeDay(); scrollTo({top:0,behavior:'smooth'});});
}
const closeDay=()=>document.getElementById('ov').classList.remove('open');

/* ── chrome ──────────────────────────── */
function renderChrome(){
  document.getElementById('spotName').textContent=DATA.spot.label;
  document.getElementById('eyebrow').textContent=`ตารางน้ำทั้งปี ${DATA.year+543}`;
  document.getElementById('yearHead').textContent=`ทั้งปี ${DATA.year+543} (${DATA.year})`;
  document.getElementById('subhead').innerHTML=
    `${DATA.days.length} วัน · ${DATA.spot.lat.toFixed(4)}, ${DATA.spot.lon.toFixed(4)} · `
    + `คำนวณจากค่าฮาร์มอนิกน้ำ ${DATA.model.n_samples.toLocaleString()} ชั่วโมง · อัปเดต ${DATA.generated}`;
  // Each spot is its own generated page; link across instead of faking a switch.
  document.getElementById('spotBar').innerHTML=DATA.spots.map(s=>
    s.key===DATA.spot.key
      ? `<span class="btn on">${s.label}</span>`
      : `<a class="btn" href="tide_${DATA.year}_${s.key}.html">${s.label}</a>`).join('')
    + `<span class="btn" id="jumpToday">ไปวันนี้</span>`;
  document.getElementById('jumpToday').onclick=()=>{
    renderHero(todayISO()); scrollTo({top:0,behavior:'smooth'});};

  const m=DATA.model;
  document.getElementById('warn').innerHTML =
    `<b>อ่านก่อนใช้จริง</b> — ตารางนี้คำนวณจากโมเดล Open-Meteo ไม่ใช่ตารางน้ำทางการ `
    + `เวลาน้ำขึ้น/ลงใช้ได้ แต่ระดับความสูงเป็นค่าประมาณ (คลาดเคลื่อนราว `
    + `${(m.holdout_mae_m??m.rms_residual_m)*100|0} ซม.) `
    + `ถ้าจะข้ามสันทราย ลุยหาด หรืออะไรที่พลาดไม่ได้ ให้เทียบกับตารางน้ำ `
    + `กรมอุทกศาสตร์ กองทัพเรือ (เกาะสมุย) อีกครั้ง`;

  document.getElementById('foot').innerHTML=`
    <p><b>คะแนนน้ำ (0-100)</b> รวม 4 อย่าง: ความแรงน้ำเดินสูงสุดของวัน (45), ช่วงน้ำกว้างแค่ไหนเทียบทั้งปี (25),
      ช่วงน้ำเดินตรงกับหัวรุ่ง/หัวค่ำหรือไม่ (20), และมีช่วงน้ำเดินดีหลายรอบไหม (10)</p>
    <p><b>น้ำเดินดี</b> = ช่วงที่อัตราเปลี่ยนระดับน้ำเกิน 60% ของอัตราสูงสุดวันนั้น — ปลากินตอนน้ำเดิน ไม่ใช่ตอนน้ำนิ่ง ช่วงน้ำนิ่งรอบจุดกลับตัวคือช่วงตาย</p>
    <p><b>วิธีคำนวณ</b> — fit ค่าฮาร์มอนิกน้ำจากข้อมูลจริง ${m.n_samples.toLocaleString()} ชั่วโมงย้อนหลัง
      (${m.obs_window[0]} → ${m.obs_window[1]}) ด้วย least squares 27 องศาน้ำ
      แล้วคำนวณล่วงหน้าทั้งปี — วิธีเดียวกับที่ทำตารางน้ำจริง
      <br>R² = ${m.variance_explained} · RMS = ${m.rms_residual_m} m
      ${m.holdout_rms_m?` · ทดสอบกับข้อมูลจริงปี ${m.holdout_from.slice(0,4)} ที่ไม่ได้ใช้ fit: RMS ${m.holdout_rms_m} m, MAE ${m.holdout_mae_m} m`:''}</p>
    <p><b>องศาน้ำหลัก</b> ${m.top.map(c=>`<code>${c.name} ${c.amp} m</code>`).join(' ')}
      <br>อ่าวไทยแถบสมุยเป็นระบบ diurnal — K1 กับ O1 เด่นกว่า M2 แปลว่าส่วนใหญ่ <b>น้ำขึ้นลงวันละรอบเดียว</b> ไม่ใช่วันละสองรอบ</p>
    <p style="margin-top:12px;color:var(--dim2)">สร้างโดย <code>~/.hermes/fishing/generate_year.py</code> · ข้อมูล Open-Meteo Marine API</p>`;
}

renderChrome(); renderHero(todayISO()); renderStrip(); renderYear();
document.addEventListener('click',e=>{
  const t=e.target.closest('.cell[data-d],.scard[data-d]');
  if(t) openDay(t.dataset.d);
  if(e.target.id==='ov') closeDay();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDay()});
</script>
</body>
</html>
